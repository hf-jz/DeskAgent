</g></g>
<g class="fu" style="animation-delay:6s">
<text x="480" y="560" font-size="12" fill="rgba(255,255,255,0.45)" font-weight="400" text-anchor="middle">滚轮切换卡片 · 点击活动卡片 = 运行 / 停止 · 关闭 = 彻底停止（无影子任务）</text>
