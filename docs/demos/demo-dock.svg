<text x="-80" y="-130" font-size="16" fill="#e8edf2" font-weight="700" text-anchor="start">AI泡沫动态</text>
<text x="-80" y="-108" font-size="11" fill="rgba(255,255,255,0.45)" font-weight="400" text-anchor="start">⏱ 0 9,17 * * *</text>
<text x="-80" y="-30" font-size="26" fill="#34d399" font-weight="800" text-anchor="start">66 运行中</text>
<circle cx="86" cy="130" r="22" fill="rgba(52,211,153,0.25)" stroke="#34d399" stroke-width="2"/>
<text x="86" y="138" font-size="16" fill="#34d399" text-anchor="middle" class="bl" style="animation-delay:2.5s">⏸</text>
<text x="86" y="138" font-size="16" fill="#34d399" text-anchor="middle" style="animation:fadeIn .1s 4.5s both">▶</text>
</g></g>
<g class="fi" style="animation-delay:0.3s">
<g transform="translate(440,300) scale(0.9) rotate(-16)" style="transform-origin:120px 170px">
<rect x="-100" y="-170" width="240" height="340" rx="20" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
<text x="-80" y="-130" font-size="13" fill="#e8edf2" font-weight="700" text-anchor="start">每日要闻</text>
<text x="-80" y="-108" font-size="10" fill="rgba(255,255,255,0.45)" font-weight="400" text-anchor="start">⏱ 0 8 * * *</text>
<text x="-80" y="-30" font-size="18" fill="rgba(255,255,255,0.45)" font-weight="800" text-anchor="start">33 休眠</text>
<circle cx="86" cy="130" r="18" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.14)"/>
<text x="86" y="136" font-size="13" fill="rgba(255,255,255,0.45)" text-anchor="middle">▶</text>
</g></g>
<g class="fi" style="animation-delay:0.6s">
<g transform="translate(740,300) scale(0.9) rotate(-16)" style="transform-origin:120px 170px">
<rect x="-100" y="-170" width="240" height="340" rx="20" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
<text x="-80" y="-130" font-size="13" fill="#e8edf2" font-weight="700" text-anchor="start">定时汇总</text>
<text x="-80" y="-108" font-size="10" fill="rgba(255,255,255,0.45)" font-weight="400" text-anchor="start">⏱ 0 12 * * *</text>
<text x="-80" y="-30" font-size="18" fill="rgba(255,255,255,0.45)" font-weight="800" text-anchor="start">33 休眠</text>
