99999999999s"/><line x1="110.0" y1="494.2" x2="139.0" y2="477.5" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round" class="st" style="transform-origin:100px 500px;animation-delay:0.99s"/></g>
