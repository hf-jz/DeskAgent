<g class="fu" style="animation-delay:1.5s"><rect x="580" y="360" width="300" height="96" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.14)" stroke-width="1"/></g>
<text x="730" y="388" font-size="13" fill="#e8edf2" font-weight="700" text-anchor="middle">Orchestrator</text>
<text x="662" y="414" font-size="11" fill="rgba(255,255,255,0.45)" font-weight="400" text-anchor="start">planner: kimi-k3</text>
<text x="662" y="434" font-size="11" fill="rgba(255,255,255,0.45)" font-weight="400" text-anchor="start">worker: deepseek-v4-pro</text>
<g class="fi" style="animation-delay:1.8s"><line x1="700" y1="456" x2="700" y2="510" stroke="rgba(255,255,255,0.14)" stroke-dasharray="4 4"/></g>
<g class="fu" style="animation-delay:2s"><rect x="600" y="510" width="280" height="110" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.14)" stroke-width="1"/></g>
<text x="740" y="538" font-size="12.5" fill="#e8edf2" font-weight="700" text-anchor="middle">TaskTreePanel</text>
<text x="740" y="558" font-size="10.5" fill="rgba(255,255,255,0.45)" font-weight="400" text-anchor="middle">任务树实时推送</text>
