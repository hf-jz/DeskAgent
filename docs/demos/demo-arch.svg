<circle class="dot2" r="6" fill="#38bdf8" style="transform-origin:555px 160px"/>
<text x="480" y="668" font-size="11" fill="rgba(255,255,255,0.45)" font-weight="400" text-anchor="middle">simple 请求走 BridgeManager → 独立 bridge.py；complex 走 Orchestrator → 任务树实时推送</text>
