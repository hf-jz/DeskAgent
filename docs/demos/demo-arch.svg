<g class="fu" style="animation-delay:1s"><rect x="480" y="210" width="220" height="82" rx="14" fill="rgba(52,211,153,0.08)" stroke="#34d399" stroke-width="1"/></g>
<text x="590" y="238" font-size="13.5" fill="#e8edf2" font-weight="700" text-anchor="middle">TaskRouter</text>
<text x="590" y="260" font-size="11" fill="rgba(255,255,255,0.45)" font-weight="400" text-anchor="middle">simple / complex 分级路由</text>
<g class="fi" style="animation-delay:1.2s"><line x1="490" y1="292" x2="370" y2="360" stroke="rgba(255,255,255,0.14)" stroke-dasharray="4 4"/></g>
<g class="fu" style="animation-delay:1.4s"><rect x="260" y="360" width="220" height="82" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.14)" stroke-width="1"/></g>
<text x="370" y="388" font-size="13" fill="#e8edf2" font-weight="700" text-anchor="middle">BridgeManager</text>
<text x="370" y="408" font-size="10.5" fill="rgba(255,255,255,0.45)" font-weight="400" text-anchor="middle">Map&lt;id, bridge&gt; · 每气泡一进程</text>
<g class="fi" style="animation-delay:1.6s"><line x1="330" y1="442" x2="210" y2="500" stroke="rgba(255,255,255,0.14)" stroke-dasharray="4 4"/><line x1="400" y1="442" x2="400" y2="500" stroke="rgba(255,255,255,0.14)" stroke-dasharray="4 4"/></g>
<g class="fu" style="animation-delay:1.8s"><rect x="130" y="500" width="180" height="62" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.14)" stroke-width="1"/></g>
