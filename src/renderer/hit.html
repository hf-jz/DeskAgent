<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data:" />
  <style>
    * { margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: transparent; cursor: pointer; }
  </style>
</head>
<body>
  <script>
    var dragging = false
    var lastX = 0
    var lastY = 0
    var moved = false

    document.addEventListener('mousedown', function(e) {
      if (e.button === 2) return
      dragging = true
      moved = false
      lastX = e.screenX
      lastY = e.screenY
      window.deskAppAPI.sendDragStart(e.screenX, e.screenY)
    })

    window.addEventListener('mousemove', function(e) {
      if (!dragging) return
      var dx = e.screenX - lastX
      var dy = e.screenY - lastY
      if (Math.abs(dx) > 1 || Math.abs(dy) > 1) moved = true
      lastX = e.screenX
      lastY = e.screenY
      if (moved) window.deskAppAPI.sendDragMove(dx, dy)
    })

    window.addEventListener('mouseup', function() {
      if (!dragging) return
      dragging = false
      window.deskAppAPI.sendDragEnd()
      if (!moved) { window.deskAppAPI.openPet() }
    })

    document.addEventListener('contextmenu', function(e) {
      e.preventDefault()
      window.deskAppAPI.showContextMenu()
    })

    // ── 文件投喂：Finder 拖文件/文件夹到宠物身体 ──
    // Finder 拖拽时鼠标按下发生在 Finder 窗口，不会触发上面的 mousedown
    // 拖宠物逻辑；窗口内拖宠物时不会有 DnD 事件 —— 天然互斥。
    var feedHover = false

    document.addEventListener('dragover', function(e) {
      e.preventDefault() // 必须：否则 drop 永不触发
      if (!feedHover) {
        feedHover = true
        window.deskAppAPI.feedHover()
      }
    })

    document.addEventListener('dragleave', function() {
      if (feedHover) {
        feedHover = false
        window.deskAppAPI.feedLeave()
      }
    })

    document.addEventListener('drop', function(e) {
      e.preventDefault()
      feedHover = false
      var files = e.dataTransfer.files
      if (!files || files.length === 0) return
      var paths = []
      for (var i = 0; i < files.length; i++) {
        var p = window.deskAppAPI.getFilePath(files[i])
        if (p) paths.push(p)
      }
      if (paths.length > 0) window.deskAppAPI.sendFeed(paths)
    })
  </script>
</body>
</html>
